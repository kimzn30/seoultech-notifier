name: Seoultech Notice Notifier

on:
  schedule:
    # GitHub의 실제 실행 시각은 부하에 따라 몇 분 밀릴 수 있습니다.
    - cron: "*/10 * * * *" # 10분마다
  workflow_dispatch: {} # Actions 탭에서 수동으로도 실행 가능

permissions:
  contents: write # seen_posts.json 변경 사항을 다시 커밋하기 위해 필요

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check boards and send email if there's anything new
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python main.py

      - name: Save updated seen_posts.json back to the repo
        run: |
          git config user.name "seoultech-notifier-bot"
          git config user.email "actions@users.noreply.github.com"
          git add seen_posts.json subscribers.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update state files"
            git pull --rebase origin main || true
            git push
          fi
